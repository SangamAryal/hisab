name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PocketBase API tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./get-pocketbase.sh
      - run: npm test

  docker:
    name: Backend container (Railway build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Railway builds
        run: docker build -f backend/Dockerfile -t hisab-backend .
      - name: Start it and check the API answers
        run: |
          docker run -d --name hisab -e PORT=9000 -p 9000:9000 \
            -e HISAB_ADMIN_EMAIL=ci@example.com -e HISAB_ADMIN_PASSWORD=ci-password-123 hisab-backend
          for i in $(seq 1 20); do curl -fs localhost:9000/api/health && break; sleep 1; done
          curl -fs localhost:9000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:9000/api/hisab/invite/nope)" = 404
          curl -fs -X POST localhost:9000/api/collections/_superusers/auth-with-password \
            -H 'content-type: application/json' -d '{"identity":"ci@example.com","password":"ci-password-123"}' >/dev/null
      - if: failure()
        run: docker logs hisab

  android:
    name: Android (tests + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug ${{ vars.HISAB_API_URL && format('-Phisab.apiUrl={0}', vars.HISAB_API_URL) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: hisab-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload APK to Google Drive (replaces the previous one)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1HKxoO0B9-U86aX7_eOcLBE8Ajsygkb94' }}
        run: .github/scripts/upload-apk-to-drive.sh composeApp/build/outputs/apk/debug/composeApp-debug.apk

  ios:
    name: iOS (tests + simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on the iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd iosApp && xcodegen
      - name: Build app for the simulator
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build
