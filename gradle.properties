# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Hisab: the PocketBase server the app talks to. Leave empty to use a server
# on your own computer (Android emulator: 10.0.2.2:8090, iOS simulator:
# 127.0.0.1:8090). Release builds pass -Phisab.apiUrl=https://your-server.
hisab.apiUrl=
